<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Toggle</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="input-wrapper">
      <input type="password" placeholder="Enter Your Password" class="inputbox" id="passwordInput">
      <img src="images/eye-close.png" alt="Toggle" class="input-icon" id="toggleIcon">
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
